name: Deploy SMAN 13 to Shared Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Fast Deploy Code & Migrate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Deploy Application Code via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            vendor/**
            node_modules/**
            .env
            .env.*
            storage/**
            tests/**
            phpunit.xml
            .editorconfig
            README.md
            vite.config.js
            package.json
            package-lock.json

      - name: 3. Trigger Database Migration & Cache Clear
        run: |
          echo "Menjalankan migrasi database otomatis di hosting..."
          RESPONSE=$(curl -s -L "https://sman13.annuur.id/artisan-migrate/sman13_auto_migrate_secret_key" || true)
          echo "$RESPONSE"
